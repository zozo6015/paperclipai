apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
spec:
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
  hostnames:
    - paperclip.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paperclip
          port: 80
