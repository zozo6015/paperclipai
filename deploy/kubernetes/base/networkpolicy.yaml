# Default deny for everything in the namespace; explicit allows follow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP from any source. Tighten this in your overlay to your ingress
    # controller / Gateway (overlays/zolab replaces it with a Cilium policy
    # that admits only the Cilium Gateway).
    - ports:
        - port: 3100
          protocol: TCP
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (in-namespace CNPG cluster or an external server)
    - ports:
        - port: 5432
          protocol: TCP
    # LLM provider APIs, git over HTTPS/SSH, npm registry for plugin installs
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 22
          protocol: TCP
