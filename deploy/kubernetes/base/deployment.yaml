apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  labels:
    app.kubernetes.io/component: server
spec:
  # Paperclip runs its scheduler/heartbeat in-process and keeps state on a
  # ReadWriteOnce volume: run exactly one replica and never overlap two.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: paperclip
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paperclip-config
          env:
            # Created by the cloudnativepg component (CNPG "<cluster>-app"
            # secret). With an external database, create a Secret with the
            # same name and a `uri` key holding postgres://user:pass@host/db.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paperclip-db-app
                  key: uri
            # Created out of band, never committed (see deploy/README.md).
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: PAPERCLIP_SECRETS_MASTER_KEY
            # Signs agent API tokens; falls back to BETTER_AUTH_SECRET if absent.
            - name: PAPERCLIP_AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: PAPERCLIP_AGENT_JWT_SECRET
                  optional: true
            # Credentials for the bundled Claude Code CLI (claude_local
            # agents); set one of them. Paperclip passes its environment on
            # to the claude processes it starts.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 4Gi
          startupProbe:
            # First boot applies database migrations.
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /paperclip
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
