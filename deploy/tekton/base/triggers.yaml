# GitHub push webhook -> PipelineRun, as a standalone Trigger so that any
# EventListener can pick it up:
#   - an EventListener you already run whose
#     spec.namespaceSelector includes this namespace, or
#   - the dedicated one in ../components/eventlistener.
#
#   push to main       -> sha-<commit> + latest
#   push of tag v*     -> sha-<commit> + <tag>
#
# The GitHub interceptor validates the webhook signature with the secret in
# THIS namespace, so events from other repositories sharing the same
# EventListener URL (signed with their own secrets) never match.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: paperclip-github-push
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
    - name: release-tag
      value: $(extensions.release_tag)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: paperclip-image
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: release-tag
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: paperclip-image-
        labels:
          app.kubernetes.io/part-of: paperclip-ci
      spec:
        pipelineRef:
          name: paperclip-image
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: release-tags
            value: ["$(tt.params.release-tag)"]
        # The non-native platform is built under QEMU emulation (bundled in
        # the BuildKit image for every node architecture), which is several
        # times slower than native.
        timeouts:
          pipeline: 6h0m0s
        taskRunTemplate:
          serviceAccountName: paperclip-build
          podTemplate:
            securityContext:
              runAsNonRoot: true
              fsGroup: 65532
        workspaces:
          - name: dockerconfig
            secret:
              secretName: ghcr-credentials
              items:
                - key: .dockerconfigjson
                  path: config.json
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: paperclip-github-push
  labels:
    app.kubernetes.io/part-of: paperclip-ci
spec:
  # The EventListener impersonates this ServiceAccount to create the
  # PipelineRun here, so it needs no create rights in this namespace itself.
  serviceAccountName: paperclip-triggers
  interceptors:
    - ref:
        name: github
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secretToken
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
      params:
        - name: filter
          value: >-
            body.deleted == false &&
            (body.ref == 'refs/heads/main' || body.ref.startsWith('refs/tags/v'))
        - name: overlays
          value:
            - key: release_tag
              expression: >-
                body.ref.startsWith('refs/tags/') ? body.ref.split('/')[2] : 'latest'
  bindings:
    - ref: paperclip-github-push
  template:
    ref: paperclip-image
