# Identity for PipelineRun pods. Needs no Kubernetes API access; registry
# credentials are mounted from the ghcr-credentials Secret as a workspace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-build
automountServiceAccountToken: false
---
# Identity the EventListener impersonates (Trigger.spec.serviceAccountName)
# to create PipelineRuns. It can do exactly that, in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-triggers
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperclip-triggers
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-triggers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperclip-triggers
subjects:
  - kind: ServiceAccount
    name: paperclip-triggers
