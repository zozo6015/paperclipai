# Identity for PipelineRun pods. Needs no Kubernetes API access; registry
# credentials are mounted from the ghcr-credentials Secret as a workspace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-build
automountServiceAccountToken: false
---
# Identity for the EventListener, bound to the ClusterRoles shipped with
# Tekton Triggers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-triggers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-triggers-eventlistener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: paperclip-triggers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paperclip-ci-triggers-eventlistener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: paperclip-triggers
    namespace: paperclip-ci
