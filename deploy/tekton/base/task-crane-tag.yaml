apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: crane-tag
spec:
  description: Adds tags to an already-pushed image digest (runs only after the scan passed).
  params:
    - name: image
    - name: digest
    - name: tags
      type: array
    - name: version-tag
      default: ""
      description: Optional extra tag, e.g. the Paperclip version in the image
    - name: platforms
      default: linux/amd64,linux/arm64
      description: Platforms the image index must contain before it is tagged
  workspaces:
    - name: dockerconfig
      readOnly: true
  steps:
    - name: tag
      # :debug variant ships a busybox shell for the loop below.
      image: gcr.io/go-containerregistry/crane/debug:v0.22.1@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
        - name: HOME
          value: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      args: ["$(params.tags[*])"]
      script: |
        #!/busybox/sh
        set -eu
        # Refuse to promote an image that lacks a requested platform (e.g. an
        # amd64-only build from an outdated Pipeline on the cluster).
        index="$(crane manifest "$(params.image)@$(params.digest)" | tr -d ' \n')"
        for p in $(echo "$(params.platforms)" | tr ',' ' '); do
          arch="${p#*/}"
          echo "$index" | grep -q "\"architecture\":\"$arch\"" || {
            echo "image $(params.image)@$(params.digest) has no $p manifest; not tagging" >&2
            exit 1
          }
          echo "has $p"
        done
        for t in "$@" "$(params.version-tag)"; do
          [ -n "$t" ] || continue
          crane tag "$(params.image)@$(params.digest)" "$t"
          echo "tagged $(params.image):$t -> $(params.digest)"
        done
