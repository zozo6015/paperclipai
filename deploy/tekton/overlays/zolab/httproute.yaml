apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip-github-webhook
  namespace: paperclip-ci
spec:
  parentRefs:
    - name: eg
      namespace: kube-system
  hostnames:
    - webhook.example.com # set via hostnames.env
  rules:
    - matches:
        - path:
            type: Exact
            value: /
          method: POST
      backendRefs:
        # Service created by Tekton Triggers for the EventListener.
        - name: el-paperclip-github
          port: 8080
